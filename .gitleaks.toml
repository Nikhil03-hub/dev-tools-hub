# gitleaks configuration for Dev Tools Hub.
# Everything allowed below is an INTENTIONALLY FAKE value or a file whose whole
# purpose is to hold fake secrets (detection/redaction fixtures and design mocks).
# None is a real credential. Every other file is scanned with gitleaks' full
# default rule set, across full history.
title = "Dev Tools Hub"

[extend]
useDefault = true

[allowlist]
description = "Known fake secrets in fixtures, mocks and cURL converter tests"

# Path-scoped entries: files that exist to hold fake secrets.
#
# Trade-off, recorded deliberately: PATH scoping means gitleaks no longer
# inspects these files for any future secret. Fingerprint scoping -- which would
# permit exactly the known findings and still catch anything new -- was tried
# first and silently had no effect in gitleaks 8.28.0 `git` mode, so it was
# removed rather than left in place looking protective while doing nothing.
# Mitigation: each of these is a test or mock file with no reason to ever hold a
# real credential, and CI still scans every other file in full history.
paths = [
  '''(^|/)scripts/verify_debugkit\.ts$''',
  '''(^|/)src/lib/debugkit/samples\.ts$''',
  # Canonical jwt.io example token (payload {"sub":"1234567890"}); proves paste
  # detection routes a JWT to the decoder.
  '''(^|/)src/core/detect/detect\.test\.ts$''',
  # Static design mock: bearer placeholder ends in ".FAKE" and targets
  # api.example.com.
  '''(^|/)docs/v3/design/reference\.html$''',
]

# Value-scoped entries, added for T-203 and deliberately NOT path-scoped.
#
# gitleaks' `curl-auth-header` / `curl-auth-user` rules fire on any curl command
# carrying an authorization header or a -u credential, whatever the value looks
# like -- so a cURL converter cannot ship a sample command, or a test that proves
# redaction works, without tripping them. These are exactly the fake literals the
# fixtures use, so the files stay under full scrutiny for anything else. That is
# why this list is preferred over adding src/tools/curl/** to `paths` above.
#
# Verified with gitleaks 8.28.0 in `git` mode -- the same version and command CI
# runs: the 6 findings on cf954cb go to 0, and a real-shaped token planted in a
# fresh file is still reported (see docs/v3/reports/T-203.md).
regexes = [
  '''demo-token-abc123''',
  '''demo-key-9f3a7b2c''',
  '''key-9f3a7b2c''',
  '''TOPSECRET123''',
  '''user:secretphrase''',
  '''user:pass''',
  # The jwt.io token as one literal, which lived in convert.test.ts at cf954cb
  # before HEAD replaced it with a runtime join. History is scanned, so it has to
  # be allowed by value rather than fixed by deleting it from the tree.
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U''',
]
